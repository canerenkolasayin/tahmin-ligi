<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tahmin Ligi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000040">
<!-- Home-screen app (iPhone: Safari > Share > Add to Home Screen) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tahmin Ligi">
<!-- The app is always navy, so the iPhone status bar shows white text over the page itself. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a matchday programme; scoreboard digit boxes are the signature element */
/* Colours: Champions League night palette (deep navy, electric blue, cyan; leaders get a cyan badge).
   One look for everyone: the same navy/cyan colours whether the phone is in light or dark mode. */
:root{
  --bg:#000040; --surface:#0a0a55; --ink:#ffffff; --muted:#a9b0d6; --line:#22227a; --chip:#15156b;
  --accent:#00eeff; --accent-ink:#000040; --board:#ffffff; --board-ink:#000040;
  --good:#00d9f7; --live:#ff4b55; --miss:#5c6396; --glow:#0232ff;
  /* Saira Condensed for everything (Google Fonts, has all Turkish letters). */
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,color-mix(in srgb,var(--glow) 55%,transparent),transparent 420px) no-repeat;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 8px));padding-bottom:max(48px,calc(env(safe-area-inset-bottom,0px) + 32px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,a,input{touch-action:manipulation}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.belltop{position:absolute;top:0;right:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95;letter-spacing:.01em;margin:0;text-transform:capitalize}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:capitalize}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px;color:var(--muted)}
.pcrow{align-items:flex-end;gap:10px}
.bell{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;color:var(--muted);cursor:pointer}
.bell .bi{display:grid;color:var(--muted);transition:color .2s}
.bell.on .bi{color:var(--accent)}
.bell .tg{position:relative;width:36px;height:20px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,box-shadow .2s}
.bell .kn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.bell.on .tg{background:var(--accent);box-shadow:none}
.bell.on .kn{transform:translateX(16px)}
.bell:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.bell .tg,.bell .kn,.bell .bi{transition:none}}
.pcf{display:flex;flex-direction:column;gap:3px}
.me b{color:var(--ink);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--accent);overflow-x:auto}
.tab{background:none;border:0;padding:8px 9px 6px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:capitalize;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);font-size:22px;font-weight:700;text-transform:capitalize;letter-spacing:.03em;margin:0}
.muted{color:var(--muted)}
/* Inside capitalised labels: keep Turkish suffixes after an apostrophe lower-case (20:45'de). */
.nocap{text-transform:none}
.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:7px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.field{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:0}
.pin{width:120px;letter-spacing:.5em;font-family:var(--display);font-size:22px;font-weight:700;text-align:center}
.err{color:var(--accent);font-size:13px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.weeknav .wk{font-family:var(--display);font-weight:700;font-size:26px;text-transform:capitalize;letter-spacing:.03em;text-align:center}
.weeknav .wk small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;flex:none}
.arrow:disabled{opacity:.3;cursor:default}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.match{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.05em;text-transform:capitalize;color:var(--muted)}
.state{font-weight:600}
.state.open{color:var(--good)} .state.live{color:var(--live)} .state.ft{color:var(--ink)} .state.lock{color:var(--muted)}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.team.home{text-align:right}
/* Team logos (see logo()): fixed square boxes so rows never shift while a logo loads. The logo sits
   on the inner side, next to the score: "Home [logo] 2 : 1 [logo] Away". */
.tl{flex:none;display:inline-block;width:22px;height:22px;object-fit:contain}
.tl.ini{display:inline-grid;place-items:center;border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font:700 9px/1 var(--body);letter-spacing:0;text-transform:none}
.tn{min-width:0}
.team{display:flex;align-items:center;gap:8px}
.team.home{justify-content:flex-end}
.team .tl{width:28px;height:28px}
.qh,.qa{display:flex;align-items:center;gap:6px}
.qh{justify-content:flex-end}
.qrow .tl{width:20px;height:20px}
.fx .tl{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
td.name .tm{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;max-width:100%}
.league .tl{width:20px;height:20px}
.score{display:flex;align-items:center;gap:5px}
.score .sep{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted)}
.digit{width:44px;height:48px;border-radius:6px;border:0;background:var(--board);color:var(--board-ink);font-family:var(--display);font-weight:700;font-size:28px;text-align:center;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.digit.livebox{background:var(--live);color:var(--accent-ink)}
input.digit{padding:0}
/* "No prediction" dash: drawn as a bar (not a "–" character) so it sits exactly in the middle
   of score boxes and table cells, whatever the font. Empty inputs draw the same bar as a background. */
.nil{display:block;width:.6em;min-width:9px;height:2px;border-radius:1px;background:currentColor;margin:0 auto}
input.digit::placeholder,input.qbox::placeholder{color:transparent}
input.digit:placeholder-shown,input.qbox:placeholder-shown{
  background-image:linear-gradient(color-mix(in srgb,var(--board-ink) 40%,transparent),color-mix(in srgb,var(--board-ink) 40%,transparent));
  background-size:12px 2px;background-repeat:no-repeat;background-position:center}
.digit.ghost{background:var(--chip);color:var(--muted)}
.under{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.pts{display:inline-block;font-family:var(--display);font-weight:700;font-size:15px;border-radius:999px;padding:0 8px;background:var(--good);color:var(--surface);font-variant-numeric:tabular-nums}
.pts.zero{background:var(--miss)}
.pts.prov{background:none;color:var(--live);box-shadow:inset 0 0 0 1.5px var(--live)}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:capitalize;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted)}
.tag.hit{background:var(--good);color:var(--surface)}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
th{font-size:11px;letter-spacing:.08em;text-transform:capitalize;color:var(--muted);font-weight:600;text-align:right;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:11px 12px;text-align:right;border-top:1px solid var(--line);vertical-align:middle}
th.l,td.l{text-align:left}
th.c,td.c{text-align:center}
td.rank{font-family:var(--display);font-weight:700;font-size:22px;width:44px;text-align:left}
td.name{font-weight:600;font-size:16px;white-space:nowrap}
td.total{font-family:var(--display);font-weight:700;font-size:24px}
/* Rank in Puan Tablosu: every number sits in the same centred box, so the leader's cyan badge
   lines up with the other ranks and with the "#" header. */
.standings .rk{display:inline-block;box-sizing:border-box;min-width:30px;padding:0 4px;border-radius:6px;text-align:center;line-height:1.3}
tr.leader td.rank .rk{background:var(--accent);color:var(--accent-ink)}
tr.isme td.name::after{content:" (sen)";color:var(--muted);font-weight:400;font-size:13px}
.lt td.fx{white-space:nowrap}
.lt .fx b{font-weight:600}
.lt .fx div{font-size:12px;color:var(--muted)}
.lt .sc{font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap}
.lt .sc.live{color:var(--live)}
.lt .sc small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.lt .sc.live small{color:var(--live)}
.lt .pk{font-family:var(--display);font-weight:600;font-size:19px;white-space:nowrap}
.lt .fx i.g,.lt .fx .fxst{display:none}
.lt .pk .pts{margin-left:6px}
.lt tfoot td{border-top:2px solid var(--ink);font-family:var(--display);font-weight:700;font-size:20px}
.lt th.mine,.lt td.mine{background:color-mix(in srgb,var(--chip) 70%,transparent)}
.league td,.league th{padding:9px 8px}
.league td.rank{font-size:18px;width:32px}
.league td.name{font-size:15px}
.league td.total{font-size:20px}
.league tr.zone td.rank{color:var(--accent)}
/* Fixed number-column widths so the Süper Lig and Champions League tables line up exactly
   (the team column takes the rest). Numbers and their headers are right-aligned. */
.league{table-layout:fixed}
.league th.rk{width:40px}
.league th.n{width:36px}
.league th.av{width:48px}
.league th.pt{width:44px}
.league th.fm{width:110px}
.league td.opt.l{white-space:nowrap}
.league td.name{white-space:normal;overflow-wrap:anywhere}
@media (max-width:600px){.league th.rk{width:32px}.league th.n{width:28px}.league th.av{width:38px}.league th.pt{width:34px}}
@media (max-width:400px){.league th.rk{width:28px}.league th.n{width:24px}.league th.av{width:34px}.league th.pt{width:30px}}
/* Smallest phones: slimmer number columns and logo so the longest names (Internazionale,
   Gençlerbirliği) still fit on one line next to their logo. */
@media (max-width:360px){.league th.n{width:21px}.league th.av{width:31px}.league th.pt{width:28px}
  .league .tl{width:14px;height:14px}.league td.name .tm{gap:4px}}
.sub{font-family:var(--display);font-size:19px;font-weight:700;text-transform:capitalize;letter-spacing:.03em;margin:4px 0 0}
.matchwrap{border-top:1px solid var(--line);padding-bottom:12px}
.matchwrap:first-child{border-top:0}
.matchwrap .match{border-top:0}
.pick{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:2px 4px 2px 10px;color:var(--ink);font-variant-numeric:tabular-nums}
.pick b{font-weight:600}
.pick:not(:has(.pts)){padding-right:10px}
.pick.mine{box-shadow:inset 0 0 0 1.5px var(--ink)}
.crow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.crow:first-child{border-top:0}
.crow .h{text-align:right;font-weight:600}
.crow .a{font-weight:600}
.crow .s{font-family:var(--display);font-weight:700;font-size:19px;text-align:center;min-width:64px;line-height:1.1}
.crow .s small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.crow .s.live,.crow .s.live small{color:var(--live)}
.ucltable tr.z1 td.rank{color:var(--good)}
.ucltable tr.z3 td.rank{color:var(--miss)}
.ucltable tr.tr td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.key{display:inline-block;font-weight:700;margin-right:4px}
.key.z1{color:var(--good)} .key.z3{color:var(--miss)}
/* Champions League quick entry */
.day{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead b{font-family:var(--display);font-size:20px;font-weight:700;text-transform:capitalize;letter-spacing:.03em}
.dayhead .state{font-size:12px;letter-spacing:.05em;text-transform:capitalize}
.prog{margin-left:8px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);vertical-align:3px}
.prog.full{background:var(--good);color:var(--surface)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 14px;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-top:1px solid var(--line);border-left:3px solid transparent}
.qtime{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);background:var(--bg);padding:4px 12px;border-top:1px solid var(--line)}
.qtime:first-child{border-top:0}
.qrow.tr{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.qrow.changed .qbox{box-shadow:0 0 0 2px var(--accent)}
.qt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qh,.qa{font-weight:600;font-size:14px;line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.qh{text-align:right}
.qscore{display:flex;align-items:center;gap:3px}
.qscore .sep{font-weight:700;color:var(--muted)}
.qbox{width:36px;height:38px;border-radius:6px;border:0;padding:0;background:var(--board);color:var(--board-ink);font-family:var(--display);font-weight:700;font-size:22px;text-align:center;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qbox.ghost{background:var(--chip);color:var(--muted)}
.qok{color:var(--good);font-weight:700;font-size:13px;text-align:center}
/* Locked Champions League rows: score boxes plus your own prediction underneath. */
.qbox.live{background:var(--live);color:var(--accent-ink)}
.qsub{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;font-size:13px;color:var(--muted);padding:1px 0 2px}
.qsub .st{font-weight:600;letter-spacing:.03em}
.qsub .st.live{color:var(--live)}
.qsub .pts{font-size:14px}
.qfoot{padding:8px 12px;border-top:1px solid var(--line)}
.savebar.sticky{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 16px rgba(0,0,0,.18)}
.lt tr.trrow td.fx{box-shadow:inset 3px 0 0 var(--accent)}
/* Periods: every value has the same padding so the period winner's cyan badge doesn't shift its column. */
.periods .pv{display:inline-block;padding:1px 3px;margin-right:-3px;border-radius:5px}
.periods td.best .pv{font-weight:700;background:var(--accent);color:var(--accent-ink)}
/* Süper Lig / Şampiyonlar Ligi switch (Liglerin Puan Tablosu) */
/* Sliding toggle (like an iPhone setting): a white knob slides under the chosen league. */
/* Full width, so it lines up with the table or cards below it. */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;padding:3px;background:var(--chip);border-radius:999px}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#fff;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.r .knob{transform:translateX(100%)}
.seg button{position:relative;border:0;background:none;padding:6px 4px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:capitalize;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.seg .knob{transition:transform .2s ease}.seg button{transition:color .2s}}
/* Oyuncu analizleri */
/* grid-auto-rows:1fr makes every row as tall as the tallest card, so all cards are the same size:
   the smallest size that fits every player's analysis. */
.ins{display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:10px;align-items:stretch}
@media (min-width:640px){.ins{grid-template-columns:1fr 1fr}
  /* A single card (the signed-in player's) spans the width, with its rows in two columns. */
  .ins.one{grid-template-columns:1fr}
  .ins.one .icard dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}}
.icard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--chip) 45%,transparent)}
.icard.mine{border-color:var(--accent)}
.icard h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;text-transform:capitalize;letter-spacing:.03em}
.icard dl{margin:0;display:flex;flex-direction:column;gap:7px}
.irow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:baseline}
.irow dt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:capitalize;color:var(--muted)}
.irow dd{margin:0;font-weight:600;line-height:1.25}
.irow dd small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.periods td.l small::before{content:"· "}
.periods td.l small{margin-left:4px}
.periods tr.wk td{color:var(--muted);padding-top:8px;padding-bottom:8px}
.periods tr.wk td.l{color:var(--ink)}
.periods tr.sum td{font-weight:700;font-size:17px}
.periods tr.sum td.l{font-family:var(--display);text-transform:capitalize;letter-spacing:.03em}
.periods tbody+tbody tr:first-child td{border-top:2px solid var(--ink)}
.periods th.mine,.periods td.mine{background:color-mix(in srgb,var(--chip) 70%,transparent)}
th.per,td.per{background:color-mix(in srgb,var(--chip) 55%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:22px;text-transform:capitalize;margin-bottom:4px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}

<script>
/* Supabase project. The publishable key is meant to be public: it can only call the

const SUPABASE_URL="https://phmvejwbjqhbqzuaomgp.supabase.co";
const SUPABASE_KEY="sb_publishable_ekb2O_nM_HgDmiOUxEeYBA_srQh1TF8";
/* Scoring pools. From Süper Lig week 13 on (Champions League matches by date, see weekBucket):
   both-teams-to-score drops to 100 and over/under 2.5 goals (100) is added. Weeks 1-12 keep the old pools. */
const NEW_RULES_WEEK=13;
const POOLS_OLD=[["exact","Tam skor",250],["winner","Kazanan",200],["btts","Karşılıklı gol",150]];
// Highest pool first; this order is used for columns, tags and the rules panel.
const POOLS=[["exact","Tam skor",250],["winner","Kazanan",200],["ou","Üst/Alt 2,5",100],["btts","Karşılıklı gol",100]];

const S={matches:[],ucl:[],uclTable:[],uclWeek:null,trTeams:new Set(),weekEnds:[],players:[],picks:{},submitted:new Set(),syncedAt:null,skew:0,loaded:false,slow:false,error:false,
  me:null,pin:null,tab:"predict",week:null,drafts:{},saving:false,loginFor:null,pinErr:"",busy:false,toast:"",toastErr:false};

async function rpc(fn,args){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const body=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error((body&&body.message)||("HTTP "+r.status));e.status=r.status;throw e}
  return body}
const now=()=>Date.now()+S.skew;

function lsGet(k){try{return localStorage.getItem("tl_"+k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem("tl_"+k):localStorage.setItem("tl_"+k,v)}catch(e){}}

function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="value")e.value=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}

/* ---------- match + scoring logic ---------- */
const fmtDate=new Intl.DateTimeFormat("tr-TR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fmtShort=new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fmtTime=new Intl.DateTimeFormat("tr-TR",{hour:"2-digit",minute:"2-digit"});
const dshort=new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"short"});
const kick=m=>new Date(m.kickoff).getTime();
const started=m=>m.state!=="pre"||now()>=kick(m);
/* A week (Süper Lig) or matchday (Champions League) locks at its first predicted kickoff:
   no more changes, and everyone's predictions become visible. */
const isUcl=m=>m.comp==="ucl";
const poolOf=m=>isUcl(m)?S.ucl:S.matches;
const canPredict=m=>m.predictable!==false;
const lockAt=(w,ms=S.matches)=>Math.min(...ms.filter(m=>m.week===w&&canPredict(m)).map(kick));
const weekLocked=(w,ms=S.matches)=>ms.some(m=>m.week===w&&canPredict(m)&&(m.state==="in"||now()>=kick(m)));
/* Lock groups: a Süper Lig week, or one Champions League day (Istanbul date). */
const istDay=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Istanbul",year:"numeric",month:"2-digit",day:"2-digit"});
const dayOf=m=>istDay.format(new Date(m.kickoff));
const groupKey=m=>isUcl(m)?"d"+dayOf(m):"w"+m.week;
const groupOf=m=>{const k=groupKey(m);return poolOf(m).filter(x=>canPredict(x)&&groupKey(x)===k)};
const groupLockAt=m=>Math.min(...groupOf(m).map(kick));
const groupLocked=m=>groupOf(m).some(x=>x.state==="in"||now()>=kick(x));
const locked=m=>started(m)||groupLocked(m);
const isLive=m=>m.state==="in";
const isFinal=m=>m.state==="post"&&m.done&&Number.isFinite(m.hs);
const scored=m=>(isLive(m)||isFinal(m))&&Number.isFinite(m.hs)&&Number.isFinite(m.as);
const sign=(a,b)=>Math.sign(a-b);
function hits(p,hs,as){return{exact:p.h===hs&&p.a===as,winner:sign(p.h,p.a)===sign(hs,as),
  btts:(p.h>0&&p.a>0)===(hs>0&&as>0),ou:(p.h+p.a>2.5)===(hs+as>2.5)}}
/* Which Süper Lig week a match counts in: its own week, or for a Champions League match the
   first Süper Lig week ending on or after its kickoff (a midweek round counts in the coming week). */
function weekBucket(m){
  if(!isUcl(m))return m.week;
  const t=kick(m),e=S.weekEnds.find(x=>x.end>=t);
  return e?e.w:(S.weekEnds.length?S.weekEnds[S.weekEnds.length-1].w:0)}
const poolsFor=m=>weekBucket(m)>=NEW_RULES_WEEK?POOLS:POOLS_OLD;
/* Two-week periods: 12–13, 14–15, 16–17, ... */
const periodOf=w=>w-(w%2);
/* Each pool is shared equally between the players who got that category right. */
function matchPoints(m){
  if(!scored(m))return null;
  const out={};
  const entrants=S.players.filter(p=>(S.picks[p.id]||{})[m.id]);
  for(const p of entrants)out[p.id]={total:0,hit:hits(S.picks[p.id][m.id],m.hs,m.as),cats:{}};
  for(const [k,,pool] of poolsFor(m)){
    const winners=entrants.filter(p=>out[p.id].hit[k]);
    for(const p of winners){const share=pool/winners.length;out[p.id].cats[k]=share;out[p.id].total+=share}
  }
  return out}
const fmtPts=x=>{const r=Math.round(x*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1)};
function untilText(ms){const mins=Math.max(0,Math.round(ms/60000));const d=Math.floor(mins/1440),hr=Math.floor(mins%1440/60),mi=mins%60;
  return d?`${d} gün ${hr} sa`:hr?`${hr} sa ${mi} dk`:`${mi} dk`}
function allMatches(){return S.matches}
function weeksOf(ms){return[...new Set(ms.map(m=>m.week))].sort((a,b)=>a-b)}
function defaultWeek(ms){const live=ms.find(isLive);if(live)return live.week;const nxt=ms.find(m=>!isFinal(m)&&m.state!=="post");return nxt?nxt.week:(ms.length?ms[ms.length-1].week:null)}
const playerById=id=>S.players.find(p=>p.id===id);
const loadedAll=()=>S.loaded;

function toast(msg,err){S.toast=msg;S.toastErr=!!err;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast="";render()},4500)}
const isLocked=e=>e&&/locked/.test(e.message||"");
const errMsg=e=>isLocked(e)?"Çok fazla hatalı PIN denemesi. 15 dakika sonra tekrar dene.":"Kaydedilemedi. Bağlantını kontrol edip tekrar dene.";

/* ---------- render ---------- */
function render(){
  const a=document.activeElement,fid=a&&a.id;let sel=null;
  try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  const ms=allMatches();
  // A notification link's week is applied once that week's data is loaded.
  if(S.jump&&weeksOf(S.jump.k==="uclWeek"?S.ucl:ms).includes(S.jump.w)){S[S.jump.k]=S.jump.w;S.jump=null}
  const wks=weeksOf(ms);if(!wks.includes(S.week))S.week=defaultWeek(ms);
  const anyLive=ms.some(isLive),uclLive=S.ucl.some(isLive);
  document.getElementById("app").replaceChildren(...[
    header(),
    S.slow&&!S.loaded?h("div",{class:"banner"},"Hâlâ bağlanıyor. İnternet bağlantını kontrol et."):null,
    S.error?h("div",{class:"banner"},S.loaded?"Sunucuya ulaşılamıyor. Gösterilen skorlar güncel olmayabilir; tekrar deneniyor.":"Veriler yüklenemedi. Tekrar deneniyor."):null,
    !S.me&&loadedAll()&&(S.tab==="predict"||S.tab==="ucl")?loginPanel():null,
    S.me&&S.pc?pinPanel():null,
    h("div",{class:"tabs",role:"tablist"},TABS.map(([k,l])=>
      h("button",{class:"tab",role:"tab","aria-selected":String(S.tab===k),onclick:()=>go(k)},(k==="live"&&(anyLive||uclLive))||(k==="ucl"&&uclLive)?h("span",{class:"dot","aria-label":"Şu an canlı maç var"}):null,l))),
    !loadedAll()?h("div",{class:"list"},h("div",{class:"empty"},h("strong",{},"Yükleniyor"),"Fikstür ve tahminler getiriliyor.")):
    !ms.length?h("div",{class:"list"},h("div",{class:"empty"},h("strong",{},"Henüz fikstür yok"),"Fikstür bir sonraki skor güncellemesinden sonra burada görünecek.")):
    S.tab==="live"?liveView(ms,wks):S.tab==="standings"?standingsView(ms):S.tab==="league"?leagueView(ms):S.tab==="ucl"?uclView():predictView(ms,wks),
    h("div",{class:"toast"+(S.toastErr?" err":""),role:"status"},S.toast)].filter(Boolean));
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus();try{sel&&el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  updateBadge();
  if(LOGO_DEBUG)drawLogoTest();
}
/* Home-screen icon badge: how many open matches in the next 7 days you haven't predicted yet
   (saved predictions only). Shown only while Maç Öncesi Bildirimler is on; cleared otherwise. */
function updateBadge(){
  if(!("setAppBadge" in navigator)||!S.loaded)return;
  let n=0;
  if(S.me&&S.push==="on"){const until=now()+7*864e5;
    n=[...S.matches,...S.ucl].filter(m=>canPredict(m)&&!locked(m)&&kick(m)<until&&!myPick(m)).length}
  if(n===updateBadge.last)return;updateBadge.last=n;
  try{(n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{})}catch(e){}}
function go(tab){S.tab=tab;if(location.hash!=="#"+tab)location.hash=tab;render()}

function header(){
  const p=S.me&&playerById(S.me);
  const upd=S.syncedAt?new Date(S.syncedAt):null;
  return h("div",{class:"top"},
    p&&S.push&&S.push!=="unsupported"?h("div",{class:"belltop"},bellSwitch()):null,
    h("div",{class:"brand"},h("h1",{},"Tahmin ",h("span",{},"Ligi")),
      h("p",{},"Süper Lig 2026–27"+(upd?" · skorlar güncellendi: "+(Date.now()-upd<864e5?fmtTime.format(upd):dshort.format(upd)):""))),
    p?h("div",{class:"me"},"Giriş yapan: ",h("b",{text:p.name}),
      h("button",{class:"link","aria-expanded":String(!!S.pc),onclick:()=>{S.pc=S.pc?null:{old:"",n1:"",n2:"",err:""};render();if(S.pc)setTimeout(()=>{const el=document.getElementById("pcOld");el&&el.focus()},0)}},"PIN'i değiştir"),

function loginPanel(){
  const p=S.loginFor&&playerById(S.loginFor);
  const pinIn=h("input",{id:"pin",class:"field pin",type:"password",inputmode:"numeric",maxlength:"4",autocomplete:"off","aria-label":"4 haneli PIN",
    oninput:e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4)},onkeydown:e=>{if(e.key==="Enter")tryLogin(pinIn.value)}});
  const waiting=S.busy;

    h("div",{class:"row"},S.players.map(x=>h("button",{class:"btn"+(x.id===S.loginFor?" sel":""),onclick:()=>{S.loginFor=x.id;S.pinErr="";render();setTimeout(()=>{const el=document.getElementById("pin");el&&el.focus()},0)},text:x.name}))),
    p?h("div",{class:"row"},pinIn,h("button",{class:"btn primary",disabled:waiting,onclick:()=>tryLogin(pinIn.value)},"Giriş yap"),
      h("span",{class:"small muted"},p.short+" için 4 haneli PIN'i gir")):h("p",{class:"small muted",style:"margin:0"},"Adını seç, sonra PIN'ini gir. Canlı tabloya ve puan tablolarına giriş yapmadan da bakabilirsin."),
    S.pinErr?h("div",{class:"err",role:"alert"},S.pinErr):null)

/* Change PIN: current PIN, new PIN twice. Values live in S.pc so a re-render keeps them. */
function pinPanel(){
  const pc=S.pc,f=(id,k,label)=>h("label",{class:"pcf"},h("span",{class:"small muted"},label),
    h("input",{id,class:"field pin",type:"password",inputmode:"numeric",maxlength:"4",autocomplete:"off",value:pc[k],
      oninput:e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);pc[k]=e.target.value},

      h("button",{class:"btn",onclick:()=>{S.pc=null;render()}},"Vazgeç")),
    h("p",{class:"small muted",style:"margin:0"},"Yeni PIN 4 rakam olmalı. Unutursan sadece Can Eren sıfırlayabilir."),
    pc.err?h("div",{class:"err",role:"alert"},pc.err):null)

async function changePin(){
  const pc=S.pc,me=S.me;if(!pc||!me||S.busy)return;
  const fail=m=>{pc.err=m;render()};
  if(!/^\d{4}$/.test(pc.old))return fail("Şu anki PIN'i gir.");
  if(!/^\d{4}$/.test(pc.n1))return fail("Yeni PIN 4 rakam olmalı.");
  if(pc.n1!==pc.n2)return fail("Yeni PIN'ler aynı değil.");
  if(pc.n1===pc.old)return fail("Yeni PIN eskisiyle aynı.");
  S.busy=true;pc.err="";render();
  try{const r=await rpc("change_pin",{p_player:me,p_pin:pc.old,p_new:pc.n1});S.busy=false;
    if(!r||!r.ok){pc.old="";return fail(r&&r.error==="bad_pin"?"Şu anki PIN yanlış.":r&&r.error==="same"?"Yeni PIN eskisiyle aynı.":"PIN değiştirilemedi.")}
    S.pin=pc.n1;lsSet("session",JSON.stringify({pid:me,pin:pc.n1}));S.pc=null;
    toast("PIN değişti. Diğer cihazlarda yeni PIN'le tekrar giriş yap.")}
  catch(e){S.busy=false;fail(isLocked(e)?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Sunucuya ulaşılamadı. Tekrar dene.")}}
async function tryLogin(pin){
  const p=playerById(S.loginFor);if(!p)return;
  if(!/^\d{4}$/.test(pin)){S.pinErr="PIN 4 haneli olmalı.";render();return}
  if(S.busy)return;S.busy=true;S.pinErr="";render();
  try{const r=await login(p.id,pin);S.busy=false;
    if(!r){S.pinErr="Bu PIN "+p.short+" için doğru değil.";render();return}
    S.loginFor=null;toast("Hoş geldin, "+p.short+".")}
  catch(e){S.busy=false;S.pinErr=isLocked(e)?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Sunucuya ulaşılamadı. Tekrar dene.";render()}}
/* Checks the PIN on the server and loads this player's own predictions (including future ones). */
async function login(pid,pin){
  const r=await rpc("login",{p_player:pid,p_pin:pin});
  if(!r||!r.ok)return false;
  S.me=pid;S.pin=pin;S.drafts={};
  const mine={};(r.picks||[]).forEach(x=>{mine[x.m]={h:x.h,a:x.a}});S.myPicks=mine;mergeMine();
  lsSet("session",JSON.stringify({pid,pin}));pushCheck(true);return true}

   S.push: "on" | "off" | "denied" (blocked in iPhone Settings) | "install" (iPhone Safari tab:
   push only works from the home-screen app) | "unsupported" (button hidden). */
const VAPID_PUBLIC="BHPi08kaKgWymktDdstovFRaq1BXfGfurNC1n7jcE0FzivFn_AP2uB7oYX9sSrd0hb2U1K5JB5pcMv38XP6KKgg";
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const b64u=s=>{const b=atob((s+"===".slice((s.length+3)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushSub(){if(!pushOK())return null;const reg=await navigator.serviceWorker.getRegistration();return reg?reg.pushManager.getSubscription():null}
const pushSave=sub=>{const j=sub.toJSON();return rpc("push_subscribe",{p_player:S.me,p_pin:S.pin,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth})};
/* On/off is remembered per phone (lsGet("push")). Turning off only removes the phone from the
   server list and keeps the iPhone's push registration, so turning on again is one quick server call
   and never has to register with Apple again (repeated register/unregister is what made iPhones
   unreliable). Older phones that registered before this flag existed count as on. */
const pushWanted=sub=>{const f=lsGet("push");return f?f==="on":!!sub};
/* Reads this phone's state. After a login, a phone that is on is re-saved for this player. */
async function pushCheck(sync){
  if(!pushOK()){S.push=isIOS()&&!standalone()?"install":"unsupported";render();return}
  try{const sub=await pushSub();
    S.push=Notification.permission==="denied"?"denied":sub&&pushWanted(sub)?"on":"off";
    if(S.push==="on"&&sync&&S.me)pushSave(sub).catch(()=>{})}
  catch(e){S.push="off"}
  render()}
/* Maç Öncesi Bildirimler switch: a bell and a small sliding toggle (no text; the name is its label). */
const BELL_SVG='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2.5a6 6 0 0 0-6 6v3.4l-1.6 2.9a1 1 0 0 0 .9 1.5h13.4a1 1 0 0 0 .9-1.5L18 11.9V8.5a6 6 0 0 0-6-6Zm-2.6 15.3a2.7 2.7 0 0 0 5.2 0Z"/></svg>';
function bellSwitch(){
  const on=S.push==="on",bi=h("span",{class:"bi"});bi.innerHTML=BELL_SVG;
  return h("button",{class:"bell"+(on?" on":""),role:"switch","aria-checked":String(on),"aria-label":"Maç Öncesi Bildirimler",title:"Maç Öncesi Bildirimler",onclick:togglePush},
    bi,h("span",{class:"tg"},h("span",{class:"kn"})))}
/* Every tap flips the switch at once and is never ignored. One background job then brings the
   phone and the server in line with the switch, one step at a time; taps made while it works are
   picked up when it finishes the current step, so the last tap always wins. */
function togglePush(ev){
  if(!S.me)return;
  if(S.push==="install"){toast("Bildirimler için Safari'de Paylaş › Ana Ekrana Ekle'ye dokun, sonra Tahmin Ligi'ni ana ekrandaki simgesinden aç.");return}
  if(S.push==="denied"){toast("Bildirim izni kapalı. iPhone Ayarlar › Bildirimler › Tahmin Ligi'nden aç.",true);return}
  const want=S.push!=="on";
  // Ask for permission straight from the tap (iPhones require it).
  const perm=want&&Notification.permission==="default"?Notification.requestPermission():null;
  S.push=want?"on":"off";lsSet("push",S.push);
  // Slide the tapped switch in place (so it animates); a full redraw would replace it.
  const btn=ev&&ev.currentTarget;
  if(btn&&btn.isConnected){btn.classList.toggle("on",want);btn.setAttribute("aria-checked",String(want))}else render();
  pushRun(perm)}
let pushJob=null;
function pushRun(perm){
  if(pushJob){pushJob.again=true;if(perm)pushJob.perm=perm;return}
  const job=pushJob={again:true,perm,err:false};
  (async()=>{
    // Let the phone draw the flipped switch before any push work starts.
    await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    try{while(job.again&&S.me){job.again=false;const p=job.perm;job.perm=null;await pushApply(p,job)}}
    finally{pushJob=null;
      if(!job.err&&S.me)toast(S.push==="on"?"Bildirimler açık. Tahminin eksikse, kilitlenmeden 2 saat önce haber veririz.":"Maç öncesi bildirimler kapandı.");
      render()}})()}
/* Makes the phone and the server match the switch (S.push). On failure the switch goes back. */
async function pushApply(perm,job){
  const want=S.push==="on";
  const fail=(msg,st)=>{if(job.again)return; // a newer tap decides
    job.err=true;S.push=st||(want?"off":"on");lsSet("push",S.push==="on"?"on":"off");toast(msg,true)};
  try{
    if(!want){const sub=await pushSub();if(sub){const r=await rpc("push_unsubscribe",{p_endpoint:sub.endpoint});if(!r||!r.ok)fail("Bildirimler kapatılamadı. Tekrar dene.")}return}
    if(perm&&await perm!=="granted")return fail("Bildirim izni verilmedi.",Notification.permission==="denied"?"denied":"off");
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    if(job.again)return; // switched off again meanwhile; the next step handles it
    const r=await pushSave(sub);
    if(!r||!r.ok){
      if(r&&r.error==="bad_pin"){job.err=true;S.push="off";lsSet("push","off");signOut();toast("PIN artık geçerli değil. Tekrar giriş yap.",true)}
      else fail("Bildirimler açılamadı. Tekrar dene.")}}
  catch(e){
    if(want&&Notification.permission==="denied")fail("Bildirim izni kapalı. iPhone Ayarlar › Bildirimler › Tahmin Ligi'nden aç.","denied");
    else fail(isLocked(e)?"Çok fazla hatalı PIN denemesi. 15 dakika sonra tekrar dene.":want?"Bildirimler açılamadı. Tekrar dene.":"Bildirimler kapatılamadı. Tekrar dene.")}}
/* Signing out: this phone stops getting that player's reminders (the next player starts with it off). */
async function pushOff(){
  lsSet("push","off");if(S.push==="on")S.push="off";
  try{const sub=await pushSub();if(sub)await rpc("push_unsubscribe",{p_endpoint:sub.endpoint})}catch(e){}}
function mergeMine(){if(S.me&&S.myPicks)S.picks[S.me]={...(S.picks[S.me]||{}),...S.myPicks}}
function signOut(){S.me=null;S.pin=null;S.myPicks=null;S.drafts={};lsSet("session",null);refresh()}
async function restoreSession(){
  let s=null;try{s=JSON.parse(lsGet("session")||"null")}catch(e){}
  if(!s||!s.pid||!s.pin)return;
  try{const ok=await login(s.pid,s.pin);if(!ok)lsSet("session",null);render()}catch(e){}}

  if(isFinal(m))return h("span",{class:"state ft"},"Maç sonu");
  if(m.state==="post")return h("span",{class:"state lock"},/postp/i.test(m.detail||"")?"Ertelendi":/canc/i.test(m.detail||"")?"İptal edildi":"Oynanmadı");

/* ---------- Team logos ----------
   Loaded from ESPN by team id (S.teamIds, filled by sync.mjs), at 64 px. The white-on-dark
   variant is tried first (black crests like Juventus' are invisible on navy); a team without
   one gets the normal logo, and a team with no logo at all gets its initials in a circle.
   Failures are remembered so a redraw doesn't ask ESPN again. */
// id -> "500" (no dark variant; remembered on the phone, so later visits ask for the right one
// straight away) | "none" (no logo; this visit only, in case it was a network hiccup).
const LOGO_V=(()=>{try{return JSON.parse(lsGet("logov")||"{}")||{}}catch(e){return {}}})();
const saveLogoV=()=>lsSet("logov",JSON.stringify(Object.fromEntries(Object.entries(LOGO_V).filter(([,v])=>v==="500"))));
const logoUrl=(id,v)=>`https://a.espncdn.com/combiner/i?img=/i/teamlogos/soccer/${v}/${id}.png&w=64&h=64`;
const initials=n=>n.replace(/\b(FK|SK|FC|CF|AŞ)\b/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toLocaleUpperCase("tr-TR");
function logo(name){
  const id=S.teamIds&&S.teamIds[name],ini=()=>h("span",{class:"tl ini","aria-hidden":"true"},initials(name));
  if(!id||LOGO_V[id]==="none"){if(LOGO_DEBUG)logoLog(name,!id?"no id → initials":"gave up earlier → initials");return ini()}
  // Each image knows which version it tried (the page redraws often, so several copies of a team's
  // logo can fail at once). On a miss it is replaced by a fresh image rather than given a new address:
  // iPhone Safari doesn't reliably reload an image element that has already failed.
  const make=(v,lazy)=>{
    const img=h("img",{class:"tl",src:logoUrl(id,v),alt:"",loading:lazy?"lazy":"eager",decoding:"async",width:"64",height:"64",crossorigin:"anonymous"});
    if(LOGO_DEBUG){img.addEventListener("load",()=>logoLog(name,v+" ok"));img.addEventListener("error",()=>logoLog(name,v+" FAIL"))}
    img.addEventListener("error",()=>{
      if(v==="500-dark"){if(LOGO_V[id]!=="500"){LOGO_V[id]="500";saveLogoV()}img.replaceWith(make("500",false))}
      else{LOGO_V[id]="none";img.replaceWith(ini())}},{once:true});
    return img};
  return make(LOGO_V[id]||"500-dark",true)}
/* TEMPORARY logo diagnostics, only with ?logotest in the address: a panel at the bottom listing every
   team, whether its id is found (exactly, or only after Unicode normalisation) and what each logo
   load did. Remove once the iPhone logo problem is solved. */
// On: ?logotest in the address, or the "Logo testi" button next to Can Eren's name (only shown to him).
const LOGO_DEBUG=/[?&]logotest/.test(location.search)||lsGet("logotest")==="1",LOGO_LOG={};
const toggleLogoTest=()=>{lsSet("logotest",LOGO_DEBUG?null:"1");location.reload()};
function logoLog(name,ev){const l=LOGO_LOG[name]=LOGO_LOG[name]||[];if(l[l.length-1]!==ev)l.push(ev);clearTimeout(logoLog.t);logoLog.t=setTimeout(drawLogoTest,300)}
function drawLogoTest(){
  if(!LOGO_DEBUG)return;let p=document.getElementById("logotest");
  if(!p){p=document.createElement("pre");p.id="logotest";p.style.cssText="white-space:pre-wrap;font:12px/1.35 ui-monospace,monospace;background:#fff;color:#000;padding:10px;margin:16px;border-radius:8px";document.body.append(p)}
  const ids=S.teamIds||{},keys=Object.keys(ids),norm=s=>s.normalize("NFC");
  const teams=[...new Set([...S.matches,...S.ucl].flatMap(m=>[m.home,m.away]))].sort((a,b)=>a.localeCompare(b,"tr"));
  const rows=teams.map(n=>{const exact=ids[n];const viaNorm=exact?null:keys.find(k=>norm(k)===norm(n));
    const code=[...n].filter(c=>c.charCodeAt(0)>127).map(c=>"U+"+c.charCodeAt(0).toString(16).toUpperCase()).join(" ");
    return `${n}${code?" ["+code+"]":""}: id=${exact||(viaNorm?"ONLY-NORMALISED("+ids[viaNorm]+")":"MISSING")} v=${LOGO_V[exact]||"-"} | ${(LOGO_LOG[n]||[]).join(", ")||"no load yet"}`});
  p.textContent=`Logo test · ${navigator.userAgent}\nSW: ${navigator.serviceWorker&&navigator.serviceWorker.controller?"on":"off"} · team ids: ${keys.length} · loaded: ${S.loaded}\n\n`+rows.join("\n")}

const teamTag=(name,end)=>{const t=h("span",{class:"tn",text:name}),l=logo(name);return end?[t,l]:[l,t]};

function matchRow(m,me){

  let center;
  if(scored(m))center=h("div",{class:"score"},digit(m.hs,isLive(m)?"livebox":""),h("span",{class:"sep"},":"),digit(m.as,isLive(m)?"livebox":""));

    const set=(k,v)=>{const cur=S.drafts[m.id]||{h:hv,a:av};cur[k]=v;S.drafts[m.id]=cur;const b=document.getElementById("save");if(b&&!S.saving)b.disabled=false};
    center=h("div",{class:"score"},digitIn("ph-"+m.id,hv,m.home+" golü",v=>set("h",v)),h("span",{class:"sep"},":"),digitIn("pa-"+m.id,av,m.away+" golü",v=>set("a",v)));
  } else center=h("div",{class:"score"},digit(mine?mine.h:null,"ghost"),h("span",{class:"sep"},":"),digit(mine?mine.a:null,"ghost"));

      under.push(h("span",{class:"pts"+(isLive(m)?" prov":"")+(pts&&pts.total===0?" zero":"")},"+"+fmtPts(pts?pts.total:0)))}
    else under.push("Bu maç için tahmin yapmadın")}

    h("div",{class:"meta"},h("span",{},fmtDate.format(new Date(m.kickoff))),statusChip(m)),
    h("div",{class:"fixture"},h("div",{class:"team home"},teamTag(m.home,true)),center,h("div",{class:"team"},teamTag(m.away))),
    under.length?h("div",{class:"under"},under):null)
}
async function savePicks(){
  const me=S.me;if(!me||S.saving)return;
  const changes=[];let incomplete=0;
  for(const [id,d] of Object.entries(S.drafts)){const m=S.matches.find(x=>x.id===id)||S.ucl.find(x=>x.id===id);if(!m||locked(m)||!canPredict(m))continue;
    if(d.h===""||d.a===""){incomplete++;continue}changes.push({m:id,h:+d.h,a:+d.a})}
  if(!changes.length){toast("Kaydetmeden önce maçın iki skorunu da gir.",true);return}
  S.saving=true;render();
  try{const r=await rpc("save_picks",{p_player:me,p_pin:S.pin,p_picks:changes});
    S.saving=false;
    if(!r||!r.ok){if(r&&r.error==="bad_pin"){signOut();toast("PIN artık geçerli değil. Tekrar giriş yap.",true)}else toast("Kaydedilemedi.",true);return}
    changes.forEach(c=>{delete S.drafts[c.m];S.myPicks=S.myPicks||{};S.myPicks[c.m]={h:c.h,a:c.a}});mergeMine();
    const skipped=r.skipped+incomplete;
    toast(`${r.saved} tahmin kaydedildi.`+(skipped?` ${skipped} tahmin kaydedilmedi (skoru eksik ya da hafta kilitlenmiş).`:""));
    refresh();
  }catch(e){S.saving=false;toast(errMsg(e),true)}
}

/* ---------- Standings ---------- */
/* Points per player, split by week and two-week period. Süper Lig and Champions League both count;
   a Champions League match counts in weekBucket(m). Final results only, plus live (provisional)
   points in the week/period columns. */
function pointsBook(){
  const book={tot:{},wk:{},per:{},n:{},c:{}};
  S.players.forEach(p=>{book.tot[p.id]=0;book.n[p.id]=0;book.c[p.id]={exact:0,winner:0,btts:0,ou:0}});
  for(const m of [...S.matches,...S.ucl.filter(canPredict)]){const pts=matchPoints(m);if(!pts)continue;
    const w=weekBucket(m),pr=periodOf(w);
    for(const pid in pts){if(!(pid in book.tot))continue;const v=pts[pid].total;
      (book.wk[w]=book.wk[w]||{})[pid]=(book.wk[w][pid]||0)+v;
      (book.per[pr]=book.per[pr]||{})[pid]=(book.per[pr][pid]||0)+v;
      if(!isFinal(m))continue;
      book.tot[pid]+=v;book.n[pid]++;poolsFor(m).forEach(([k])=>{if(pts[pid].hit[k])book.c[pid][k]++})}}
  return book}
function standingsView(ms){

    h("div",{class:"tablewrap"},h("table",{class:"league ucltable"},
      h("thead",{},h("tr",{},h("th",{class:"l rk"},"#"),h("th",{class:"l"},"Takım"),
        h("th",{class:"n",title:"Oynanan"},"O"),h("th",{class:"n",title:"Galibiyet"},"G"),h("th",{class:"n",title:"Beraberlik"},"B"),h("th",{class:"n",title:"Mağlubiyet"},"M"),
        h("th",{class:"opt n",title:"Atılan gol"},"A"),h("th",{class:"opt n",title:"Yenilen gol"},"Y"),h("th",{class:"av",title:"Averaj"},"AV"),h("th",{class:"pt"},"P"))),
      h("tbody",{},t.map(r=>h("tr",{class:zone(r)+(r.tr?" tr":"")},
        h("td",{class:"rank"},r.rank),h("td",{class:"name l"},h("span",{class:"tm"},teamTag(r.team))),
        h("td",{},r.o),h("td",{},r.g),h("td",{},r.b),h("td",{},r.m),
        h("td",{class:"opt"},r.a),h("td",{class:"opt"},r.y),
        h("td",{},sgn(r.av)),h("td",{class:"total"},r.p)))))),
    h("p",{class:"small muted",style:"margin:0"},h("span",{class:"key z1"},"1–8"),"son 16'ya doğrudan · ",h("span",{class:"key z2"},"9–24"),"play-off · ",h("span",{class:"key z3"},"25–36"),"elenir. Türk takımları vurgulanır. Sıralama UEFA'nın resmi tablosudur (ESPN)."))}

/* ---------- Süper Lig table ----------
   Built from the finished matches already in the database: 3 points a win, 1 a draw.
   Ties follow the Süper Lig rule: once the tied teams have played each other home and away,
   the head-to-head points and then head-to-head goal difference decide; otherwise (or if still level)
   overall goal difference, then goals scored. */
function tieOrder(group,fin){
  const ids=new Set(group.map(r=>r.team));
  const mutual=fin.filter(m=>ids.has(m.home)&&ids.has(m.away));
  const complete=group.every(x=>group.every(y=>x===y||mutual.some(m=>m.home===x.team&&m.away===y.team)));
  const hh={};group.forEach(r=>hh[r.team]={p:0,av:0});
  if(complete)for(const m of mutual){const s=sign(m.hs,m.as);
    hh[m.home].av+=m.hs-m.as;hh[m.away].av+=m.as-m.hs;
    if(s>0)hh[m.home].p+=3;else if(s<0)hh[m.away].p+=3;else{hh[m.home].p++;hh[m.away].p++}}
  group.forEach(r=>r.h2h=complete);
  return group.sort((x,y)=>hh[y.team].p-hh[x.team].p||hh[y.team].av-hh[x.team].av||y.av-x.av||y.a-x.a||x.team.localeCompare(y.team,"tr"))}
function tslTableView(ms){
  const T={};
  const row=n=>T[n]||(T[n]={team:n,o:0,g:0,b:0,m:0,a:0,y:0,form:[]});
  ms.forEach(m=>{row(m.home);row(m.away)});
  for(const m of ms){if(!isFinal(m)||!Number.isFinite(m.as))continue;
    const H=row(m.home),A=row(m.away);
    H.o++;A.o++;H.a+=m.hs;H.y+=m.as;A.a+=m.as;A.y+=m.hs;
    const s=sign(m.hs,m.as);
    if(s>0){H.g++;A.m++;H.form.push("G");A.form.push("M")}
    else if(s<0){A.g++;H.m++;H.form.push("M");A.form.push("G")}
    else{H.b++;A.b++;H.form.push("B");A.form.push("B")}}
  const fin=ms.filter(m=>isFinal(m)&&Number.isFinite(m.as));
  const byPts={};Object.values(T).forEach(r=>{r.av=r.a-r.y;r.p=r.g*3+r.b;(byPts[r.p]=byPts[r.p]||[]).push(r)});
  const rows=Object.keys(byPts).map(Number).sort((a,b)=>b-a).flatMap(p=>byPts[p].length>1?tieOrder(byPts[p],fin):byPts[p]);
  const n=rows.length,played=ms.filter(isFinal).length;
  const sgn=v=>v>0?"+"+v:String(v);
  return h("div",{style:"display:flex;flex-direction:column;gap:12px"},
    h("div",{class:"tablewrap"},h("table",{class:"league"},
      // Form sits right after the team name, so the number columns (O … P) line up with the
      // Champions League table, which has no form column.
      h("thead",{},h("tr",{},h("th",{class:"l rk"},"#"),h("th",{class:"l"},"Takım"),h("th",{class:"opt l fm",title:"Son 5 maç"},"Form"),
        h("th",{class:"n",title:"Oynanan"},"O"),h("th",{class:"n",title:"Galibiyet"},"G"),h("th",{class:"n",title:"Beraberlik"},"B"),h("th",{class:"n",title:"Mağlubiyet"},"M"),
        h("th",{class:"opt n",title:"Atılan gol"},"A"),h("th",{class:"opt n",title:"Yenilen gol"},"Y"),h("th",{class:"av",title:"Averaj"},"AV"),
        h("th",{class:"pt"},"P"))),
      h("tbody",{},rows.map((r,i)=>h("tr",{class:i===0&&r.o?"zone":null},
        h("td",{class:"rank"},i+1),h("td",{class:"name l",title:r.h2h?"Puan eşitliği ikili averajla ayrıldı":null},h("span",{class:"tm"},teamTag(r.team))),
        h("td",{class:"opt l"},h("span",{class:"small muted"},r.form.slice(-5).join(" ")||"–")),
        h("td",{},r.o),h("td",{},r.g),h("td",{},r.b),h("td",{},r.m),
        h("td",{class:"opt"},r.a),h("td",{class:"opt"},r.y),h("td",{},sgn(r.av)),
        h("td",{class:"total"},r.p)))))),
    h("p",{class:"small muted",style:"margin:0"},`${n} takım · ${played} maç tamamlandı. Tablo biten maçların skorlarından hesaplanır; canlı maçlar bitince eklenir. Puan eşitliğinde, takımlar birbiriyle iç sahada ve deplasmanda oynamışsa önce aralarındaki maçların puanına, sonra ikili averaja bakılır; oynamamışlarsa ya da hâlâ eşitlerse genel averaj, sonra atılan gol. Varsa puan silme cezaları tabloya yansımaz.`))
}

/* ---------- data ---------- */
/* Polls get_state: every 30 s while a match is live, otherwise every 2 minutes,
   and right away when the tab becomes visible again. */
let pollTimer=null,inFlight=false;
/* Applies a get_state result. `cached` = the copy saved on this phone from the last visit, shown
   straight away (and when offline) until fresh data arrives; it must not reset the clock offset. */
function applyState(st,cached){
    if(!cached)S.skew=Date.parse(st.now)-Date.now();
    S.players=st.players||[];
    const all=(st.matches||[]).map(m=>({...m,hs:m.hs==null?null:Number(m.hs),as:m.as==null?null:Number(m.as)}));
    S.matches=all.filter(m=>!isUcl(m));S.ucl=all.filter(isUcl);
    S.trTeams=new Set(S.matches.flatMap(m=>[m.home,m.away]));
    S.weekEnds=weeksOf(S.matches).map(w=>({w,end:Math.max(...S.matches.filter(m=>m.week===w).map(kick))}));
    S.uclTable=Array.isArray(st.ucl_table)?st.ucl_table:[];
    S.teamIds=st.team_ids&&typeof st.team_ids==="object"?st.team_ids:{};
    const picks={};(st.picks||[]).forEach(x=>{(picks[x.p]=picks[x.p]||{})[x.m]={h:x.h,a:x.a}});S.picks=picks;mergeMine();
    S.submitted=new Set((st.submitted||[]).map(x=>x.p+"|"+x.m));
    S.syncedAt=st.synced_at;S.loaded=true;
    if(!cached){S.error=false;S.slow=false;if(S.me&&!playerById(S.me))signOut()}
}
async function refresh(){
  if(inFlight)return;inFlight=true;clearTimeout(pollTimer);
  try{
    const st=await rpc("get_state");
    applyState(st,false);
    lsSet("state",JSON.stringify(st));
  }catch(e){S.error=true}
  inFlight=false;render();
  // Poll every 30 s while any match is on (or should be: kickoff passed, not finished yet).
  const on=m=>isLive(m)||(!m.done&&m.state!=="post"&&now()>=kick(m)-5*60e3&&now()<kick(m)+4*3600e3);
  pollTimer=setTimeout(refresh,S.matches.some(on)||S.ucl.some(on)?30000:120000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
window.addEventListener("online",()=>refresh());
/* Warn before leaving with unsaved predictions. */
window.addEventListener("beforeunload",e=>{if(S.me&&dirtyCount()){e.preventDefault();e.returnValue=""}});

/* Old links to the former ŞL Sonuçlar tab (#uclres) open Canlı tablo on the Champions League side. */
/* Notification links add a week: #predict/14 (Süper Lig week 14), #ucl/5 (Champions League matchday 5). */
const openHash=raw=>{let [t,w]=raw.split("/");
  if(t==="uclres"){S.liveComp="ucl";t="live";history.replaceState(null,"","#live")}
  if(w!=null){if(/^\d+$/.test(w)&&(t==="predict"||t==="ucl"))S.jump={k:t==="ucl"?"uclWeek":"week",w:+w};history.replaceState(null,"","#"+t)}
  return TABS.some(([k])=>k===t)?t:null};
S.tab=openHash((location.hash||"").slice(1))||"predict";
window.addEventListener("hashchange",()=>{const t=openHash(location.hash.slice(1));if(t){S.tab=t;render();window.scrollTo(0,0)}});
// Show the last saved data immediately, then fetch fresh data.
try{const c=JSON.parse(lsGet("state")||"null");if(c&&c.matches)applyState(c,true)}catch(e){}
render();
setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
setInterval(render,30000);
refresh().then(restoreSession);
// Home-screen app support: offline start and instant opening (see sw.js).
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
